name: Optimize index one-shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-index-one-shot.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Optimize index.html
        shell: python
        run: |
          from pathlib import Path
          import hashlib

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old = "updateBadge();\nfetchDolar().then(()=>loadStoreProducts());\nsetInterval(()=>fetchDolar().then(()=>renderAllGrids()), 300000);"
          new = """updateBadge();

          // Carga inicial optimizada:
          // - productos y dólar arrancan en paralelo
          // - la tienda no espera a DolarAPI para empezar a traer el catálogo
          const initialDolarPromise = fetchDolar();
          const initialProductsPromise = loadStoreProducts();

          // Cuando termine el dólar, refresca precios si ya llegaron productos.
          initialDolarPromise.then(() => {
            if (storeProducts.length) renderAllGrids();
          });

          // Protección: si una API tarda demasiado, el splash no bloquea toda la web.
          setTimeout(() => {
            hideSplash();
          }, 1200);

          setInterval(()=>fetchDolar().then(()=>renderAllGrids()), 300000);"""

          if old not in text:
              raise SystemExit('No se encontró el bloque de carga inicial esperado')
          text = text.replace(old, new, 1)

          old_hide = """function hideSplash(){
            const bar = document.getElementById('splash-bar');
            if(bar) bar.style.width = '100%';
            setTimeout(() => {
              const splash = document.getElementById('splash');
              if(splash) splash.classList.add('hidden');
            }, 500);
          }"""

          new_hide = """function hideSplash(){
            const splash = document.getElementById('splash');
            if(!splash || splash.classList.contains('hidden')) return;

            const bar = document.getElementById('splash-bar');
            if(bar) bar.style.width = '100%';

            setTimeout(() => {
              splash.classList.add('hidden');
            }, 250);
          }"""

          if old_hide in text:
              text = text.replace(old_hide, new_hide, 1)

          path.write_text(text, encoding='utf-8')

          data = path.read_bytes()
          blob_sha = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          expected = 'cc930dda7f1582c694312f0a3684175aec1ebb76'
          if blob_sha != expected:
              raise SystemExit(f'El archivo resultante no coincide con el optimizado esperado: {blob_sha}')
          print(f'index.html validado: {blob_sha}')

      - name: Commit optimized index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Optimize initial storefront loading"
          git push
