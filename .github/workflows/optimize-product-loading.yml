name: Refresh fallback product snapshot

on:
  push:
    branches:
      - main
    paths:
      - '.github/optimize_products.py'
      - '.github/workflows/optimize-product-loading.yml'
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-product-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh fallback snapshot
        run: python .github/optimize_products.py

      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products-cache.json
          if git diff --cached --quiet; then
            echo "No snapshot changes"
            exit 0
          fi
          git commit -m "Refresh fallback product snapshot"
          git push
