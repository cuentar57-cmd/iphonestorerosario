name: Optimize product loading

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-product-loading.yml'
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize-storefront:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Optimize catalog loading
        run: python .github/optimize_products.py
      - name: Commit optimized storefront
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html products-cache.json
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Speed up initial product loading'
          git push
