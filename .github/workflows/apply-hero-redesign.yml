name: Apply homepage hero redesign

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-hero-redesign.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Force hero refinement in index
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          # Bust stylesheet cache.
          html = html.replace('hero-redesign.css?v=20260830', 'hero-redesign.css?v=20260830b')

          marker = '/* FORCE HERO REFINEMENT INLINE 20260830B */'
          if marker not in html:
              inline = '''
<style>
/* FORCE HERO REFINEMENT INLINE 20260830B */
.hero-phone-back{display:none!important}
@media(max-width:850px){
  .hero-visual{display:none!important}
  .hero.hero-redesign{min-height:auto!important;padding:105px 6% 40px!important}
  .hero-redesign .hero-content{width:100%!important;max-width:100%!important}
  .hero-trust{position:relative!important;left:auto!important;bottom:auto!important;width:100%!important;margin-top:24px!important}
}
</style>
'''
              html = html.replace('</head>', inline + '</head>', 1)

          p.write_text(html, encoding='utf-8')
          PY

      - name: Commit forced refinement
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Force hero cleanup and mobile hide in index'
          git push
