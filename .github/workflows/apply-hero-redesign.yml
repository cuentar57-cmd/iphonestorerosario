name: Apply homepage hero redesign

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-hero-redesign.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refine hero visual
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('hero-redesign.css')
          css = p.read_text(encoding='utf-8')
          marker = '/* HERO REFINEMENT: REAL PHONE ONLY ON DESKTOP */'
          if marker not in css:
              css += '''\n\n/* HERO REFINEMENT: REAL PHONE ONLY ON DESKTOP */\n.hero-phone-back{display:none!important}\n@media(max-width:850px){\n  .hero-visual{display:none!important}\n  .hero.hero-redesign{min-height:auto;padding:105px 6% 40px}\n  .hero-redesign .hero-content{width:100%;max-width:100%}\n  .hero-trust{position:relative;left:auto;bottom:auto;width:100%;margin-top:24px}\n}\n'''
              p.write_text(css, encoding='utf-8')
          PY

      - name: Commit refinement
        run: |
          if git diff --quiet -- hero-redesign.css; then
            echo 'No hero refinement changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hero-redesign.css
          git commit -m 'Refine hero: remove generated phone and hide visual on mobile'
          git push
