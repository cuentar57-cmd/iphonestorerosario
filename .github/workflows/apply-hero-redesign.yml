name: Apply homepage hero redesign

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-hero-redesign.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply hero patch
        run: python .github/apply_hero.py
      - name: Commit homepage redesign
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Redesign homepage hero with animated iPhone showcase'
          git push
