name: Apply homepage hero redesign

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-hero-redesign.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bust hero CSS cache and force rules inline
        shell: bash
        run: |
          sed -i 's/hero-redesign.css?v=20260830/hero-redesign.css?v=20260830c/g' index.html
          sed -i 's#</head>#<style>.hero-phone-back{display:none!important}@media(max-width:850px){.hero-visual{display:none!important}.hero.hero-redesign{min-height:auto!important;padding:105px 6% 40px!important}.hero-redesign .hero-content{width:100%!important;max-width:100%!important}.hero-trust{position:relative!important;left:auto!important;bottom:auto!important;width:100%!important;margin-top:24px!important}}</style></head>#' index.html
      - name: Commit forced refinement
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Force hero cleanup in published index'
          git push
