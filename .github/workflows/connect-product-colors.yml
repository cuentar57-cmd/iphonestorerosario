name: Connect product colors

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-product-colors.yml'

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')

          # Link color catalog before main script
          marker='<script>\nconst SHEETS_URL'
          if '<script src="product-images.js"></script>' not in text:
              if marker not in text: raise SystemExit('Main script marker not found')
              text=text.replace(marker,'<script src="product-images.js"></script>\n<script>\nconst SHEETS_URL',1)

          css='''\n/* ===== PRODUCT COLOR SELECTOR ===== */\n.product-colors{display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;margin:10px 0 2px}\n.color-dot{width:20px;height:20px;border-radius:50%;border:2px solid rgba(127,127,127,.25);box-shadow:0 0 0 1px rgba(0,0,0,.08);cursor:pointer;transition:.18s;position:relative}\n.color-dot:hover{transform:scale(1.16)}\n.color-dot.active{border-color:var(--violet);box-shadow:0 0 0 2px rgba(98,0,255,.18)}\n.detail-color-block{margin-top:12px}\n.detail-color-label{font-size:.72rem;color:var(--gray);font-weight:700;text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px}\n.detail-color-name{font-size:.85rem;color:var(--text-muted);margin-top:7px;font-weight:600}\n.detail-color-block .product-colors{justify-content:flex-start;margin:0}\n@media(max-width:600px){.color-dot{width:17px;height:17px}.product-colors{gap:5px;margin:7px 0 1px}}\n'''
          if '/* ===== PRODUCT COLOR SELECTOR ===== */' not in text:
              text=text.replace('</style>',css+'\n</style>',1)

          old='<div class="storage" id="detailStorage"></div>'
          new=old+'\n            <div id="detailColors" class="detail-color-block"></div>'
          if 'id="detailColors"' not in text:
              if old not in text: raise SystemExit('Detail storage marker not found')
              text=text.replace(old,new,1)

          s=text.find('function buildProductCard(p){')
          e=text.find('\n\nfunction categoryIcon',s)
          if s<0 or e<0: raise SystemExit('Product card function not found')
          card=r'''function getSelectedVariant(p){
  const variants = getProductVariants(p.name);
  if(!variants.length) return null;
  const idx = Number(productVariantSelection[p.id] ?? 0);
  return variants[Math.max(0, Math.min(idx, variants.length-1))] || variants[0];
}

const productVariantSelection = {};

function selectCardVariant(event,id,index){
  event.stopPropagation();
  productVariantSelection[id]=index;
  const p=storeProducts.find(x=>x.id===id);
  if(!p) return;
  const variant=getSelectedVariant(p);
  const card=event.currentTarget.closest('.prod-card');
  if(card && variant){
    const img=card.querySelector('.product-image');
    if(img) img.src=productDriveImageUrl(variant.id);
    card.querySelectorAll('.color-dot').forEach((d,i)=>d.classList.toggle('active',i===index));
  }
}

function colorDotsHtml(p, detail=false){
  const variants=getProductVariants(p.name);
  if(!variants.length) return '';
  const selected=Number(productVariantSelection[p.id] ?? 0);
  const dots=variants.map((v,i)=>`<button type="button" class="color-dot ${i===selected?'active':''}" style="background:${v.hex}" title="${v.color}" aria-label="${v.color}" onclick="${detail?`selectDetailVariant(event,'${escQ(p.id)}',${i})`:`selectCardVariant(event,'${escQ(p.id)}',${i})`}"></button>`).join('');
  return `<div class="product-colors">${dots}</div>`;
}

function addProductToCart(id){
  const p=storeProducts.find(x=>x.id===id);
  if(!p) return;
  const variant=getSelectedVariant(p);
  const usdValue=Number(p.priceUsd || p.usd || p.price || 0);
  const priceArs=arsPrice(usdValue);
  const colorText=variant ? ` — ${variant.color}` : '';
  addToCart(`${p.name} ${p.storage||''}${colorText}`, categoryIcon(p.category), priceArs);
}

function buildProductCard(p){
  const variant=getSelectedVariant(p);
  const imageUrl=variant ? productDriveImageUrl(variant.id) : normalizeProductImageUrl(p.image);
  const usdValue=Number(p.priceUsd || p.usd || p.price || 0);
  const priceArs=arsPrice(usdValue);

  const stockBtn=p.stock===false
    ? `<button class="add-cart-btn disabled-btn" disabled>Sin Stock</button>`
    : `<button class="add-cart-btn" onclick="event.stopPropagation();addProductToCart('${escQ(p.id)}')">🛒 Agregar</button>`;

  const badge=p.stock===false
    ? `<span class="prod-badge sin-stock">Sin Stock</span>`
    : `<span class="prod-badge">${p.category==='sellado'?'Nuevo':p.category==='usado'?'Usado':p.category==='gaming'?'Gaming':p.category==='mac'?'Mac':p.category==='accesorio'?'Accesorio':'iPad'}</span>`;

  return `
    <div class="prod-card" onclick="openDetail('${escQ(p.id)}')">
      ${badge}
      <div class="product-media">
        ${imageUrl ? `<img src="${imageUrl}" alt="${p.name}" class="product-image" loading="lazy">` : `<div class="product-placeholder">${categoryIcon(p.category)}</div>`}
      </div>
      <h3>${p.name}</h3>
      <div class="storage">${p.storage||'—'}</div>
      ${colorDotsHtml(p)}
      <div class="price-label">Precio</div>
      <div class="price">${money(priceArs)}</div>
      <div class="usd-price">USD ${usdValue}</div>
      <button class="detail-btn" onclick="event.stopPropagation();openDetail('${escQ(p.id)}')">Ver detalles</button>
      ${stockBtn}
    </div>
  `;
}'''
          text=text[:s]+card+text[e:]

          s=text.find('function openDetail(id){')
          e=text.find('\n\nlet cart =',s)
          if s<0 or e<0: raise SystemExit('Detail function not found')
          detail=r'''function selectDetailVariant(event,id,index){
  event.stopPropagation();
  productVariantSelection[id]=index;
  const p=storeProducts.find(x=>x.id===id);
  if(!p) return;
  const variant=getSelectedVariant(p);
  if(variant){
    document.getElementById('detailImage').src=productDriveImageUrl(variant.id);
    renderDetailColors(p);
  }
}

function renderDetailColors(p){
  const variants=getProductVariants(p.name);
  const box=document.getElementById('detailColors');
  if(!box) return;
  if(!variants.length){ box.innerHTML=''; return; }
  const variant=getSelectedVariant(p);
  box.innerHTML=`
    <div class="detail-color-label">Color</div>
    ${colorDotsHtml(p,true)}
    <div class="detail-color-name">${variant ? variant.color : ''}</div>
  `;
}

function openDetail(id){
  const p=storeProducts.find(x=>x.id===id);
  if(!p) return;
  selectedProduct=p;
  const usdValue=Number(p.priceUsd || p.usd || p.price || 0);
  const priceArs=arsPrice(usdValue);
  const variant=getSelectedVariant(p);
  document.getElementById('detailImage').src=variant ? productDriveImageUrl(variant.id) : normalizeProductImageUrl(p.image);
  renderDetailColors(p);
  const parts=(p.name||'').split(' ');
  document.getElementById('detailName').innerHTML=`<span>${parts[0]}</span> ${parts.slice(1).join(' ')}`;
  document.getElementById('detailStorage').textContent=p.storage||'';
  document.getElementById('detailPrice').textContent=money(priceArs);
  document.getElementById('detailSidePrice').textContent=money(priceArs);
  document.getElementById('detailUsdPrice').textContent=usdValue ? 'USD '+usdValue : '';
  document.getElementById('detailDescription').textContent=p.description||'';
  document.getElementById('detailSpecs').innerHTML=Object.entries(p.specs||{})
    .map(([k,v])=>`<div class="spec-card"><span>${k}</span><strong>${v}</strong></div>`).join('');
  document.getElementById('detailBenefits').innerHTML=(p.benefits||[])
    .map(b=>`<li>${b}</li>`).join('');
  const base=priceArs*1.10;
  document.getElementById('installmentsBox').innerHTML=`
    <div class="installment-item">3 cuotas de ${money((base*1.21)/3)}</div>
    <div class="installment-item">6 cuotas de ${money((base*1.35)/6)}</div>
    <div class="installment-item">12 cuotas de ${money((base*1.70)/12)}</div>
  `;
  document.getElementById('detailAddBtn').onclick=()=>addProductToCart(p.id);
  showPage('detailPage');
}'''
          text=text[:s]+detail+text[e:]

          p.write_text(text,encoding='utf-8')
          print('Product colors connected')

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Connect product color images"
          git push
