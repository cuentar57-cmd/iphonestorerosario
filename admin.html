<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin · iPhone Store Rosario</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0a0a}#adminFrame{display:block;width:100%;height:100%;border:0}</style>
<script src="product-images.js"></script>
</head>
<body>
<iframe id="adminFrame" src="admin-core.html"></iframe>
<script src="admin-drive-patch.js"></script>
<script>
(function(){
  const frame=document.getElementById('adminFrame');
  if(!frame) return;
  frame.addEventListener('load',()=>{
    const w=frame.contentWindow;
    const d=frame.contentDocument;
    if(!w||!d||w.__sheetsSavePatched) return;
    w.__sheetsSavePatched=true;

    // Google Sheets remains the source of truth. A product save is only
    // considered complete after Apps Script confirms the write.
    w.pushToSheets=async function(silent=false){
      try{
        if(!silent && typeof w.showToast==='function') w.showToast('Guardando en Google Sheets...','info');
        if(typeof w.setBadge==='function') w.setBadge('syncing','Guardando...');
        const list=Array.isArray(w.products)?w.products:[];
        const productsForSheets=list.map(p=>({...p,
          priceUsd:Number(p.priceUsd||p.usd||p.price||0),
          usd:Number(p.priceUsd||p.usd||p.price||0),
          price:Number(p.priceUsd||p.usd||p.price||0)
        }));
        const res=await fetch(w.SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({
          action:'saveProducts',
          sessionToken:typeof w.getSessionToken==='function'?w.getSessionToken():'',
          products:productsForSheets
        })});
        if(!res.ok) throw new Error('Apps Script respondió HTTP '+res.status);
        const data=await res.json();
        if(!data.ok) throw new Error(data.error||data.message||'Apps Script rechazó el guardado');
        if(typeof w.updateSheetsBadge==='function') w.updateSheetsBadge(true);
        if(!silent && typeof w.showToast==='function') w.showToast('✓ Producto guardado y publicado','success');
        return true;
      }catch(err){
        if(typeof w.updateSheetsBadge==='function') w.updateSheetsBadge(false);
        if(typeof w.showToast==='function') w.showToast('No se pudo guardar en Google Sheets: '+(err.message||err),'error');
        console.error('Google Sheets save failed',err);
        return false;
      }
    };

    // Keep a local backup, but always send the full catalog to Sheets.
    w.saveProducts=function(p){
      try{ localStorage.setItem(w.STORAGE_KEY,JSON.stringify(p)); }catch(e){}
      if(typeof w.updateStats==='function') w.updateStats();
      return w.pushToSheets(true);
    };

    // Force a fresh import when entering the admin so stale browser data
    // cannot overwrite the live Sheet catalog.
    setTimeout(()=>{
      if(typeof w.syncFromSheets==='function') w.syncFromSheets(true);
    },300);
  });
})();
</script>
</body>
</html>
